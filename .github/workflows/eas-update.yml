# Publishes an over-the-air JavaScript update on every push.
#
# Runs on GitHub's infrastructure, which can reach api.expo.dev (the Claude
# sandbox cannot). Every push to the development branch bundles the current
# JS and publishes it to the "development" EAS Update branch; a phone running
# the development client picks it up the next time it is opened. No native
# rebuild, no laptop, no Metro.
#
# Requires the repository secret EXPO_TOKEN. The Anthropic key is pulled from
# the "development" EAS environment (variable EXPO_PUBLIC_ANTHROPIC_API_KEY)
# via --environment, so the OTA bundle ships with a working key. The guard
# step makes this a clean no-op until the token and a linked project exist,
# so early pushes do not fail red.
name: EAS Update (development)

on:
  push:
    branches:
      - claude/meridian-app-kjn60m
      - main
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard — require EXPO_TOKEN and a linked project
        id: guard
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "No EXPO_TOKEN secret set yet — skipping OTA update."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! grep -q '"projectId"' app.json; then
            echo "No EAS projectId in app.json yet — run the dev build workflow once first."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.guard.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.guard.outputs.ok == 'true'
        run: npm ci

      - name: Setup EAS
        if: steps.guard.outputs.ok == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update
        if: steps.guard.outputs.ok == 'true'
        env:
          # Pass the message through the env, not shell expansion. Direct
          # ${{ }} interpolation of a commit message that contains quotes
          # or apostrophes breaks the surrounding shell string.
          UPDATE_MESSAGE: ${{ github.event.head_commit.message || 'manual update' }}
        run: |
          # Trim to the first line and cap length — long multi-line commit
          # bodies are noise in the EAS Update list.
          SHORT_MESSAGE="$(printf '%s' "$UPDATE_MESSAGE" | head -n 1 | cut -c1-200)"
          eas update --branch development --environment development --message "$SHORT_MESSAGE"
          # Testers ride the preview channel — same JS, preview env vars
          # (proxy URL + app token; no vendor keys). Tolerated to fail
          # until the preview environment exists in the Expo dashboard.
          eas update --branch preview --environment preview --message "$SHORT_MESSAGE" || \
            echo "preview channel update skipped (environment not configured yet)"
